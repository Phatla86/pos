version: '3.8'

services:
  # 1. POSTGRESQL DATABASE
  postgres:
    image: postgres:16-alpine
    container_name: cafepos_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cafepos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. BACKEND NODE.JS EXPRESS + WEBSOCKET
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cafepos_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cafepos
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"

  # 3. FRONTEND NEXT.JS
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cafepos_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:3000"

volumes:
  postgres_data:
